<!DOCTYPE html>
<html lang="en">

<style>
:root {
  --night: #090d16;
  --night-2: #0e1422;
  --panel: #131b2e;
  --line: #1c2740;
  --ink: #e9e3d3;
  --ink-dim: #8b96af;
  --brass: #c9a557;
  --brass-dim: #796434;
  --teal: #5fd4c4;
  --teal-dim: #255d55;
  --crimson: #e2556a;
  --crimson-dim: #6d2432;
  --violet: #8f7bd8;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Source Sans 3", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--sans); }

/* --- 50/50 Vertical Split Container --- */
.split-container {
  display: flex;
  width: 100vw;
  height: 100vh;
}

/* --- Left Pane: Sphere Viewer --- */
.sphere-pane {
  flex: 1;
  height: 100vh;
  position: relative;
  background: radial-gradient(circle at 50% 50%, #101830 0%, #080c16 80%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas#sky {
  display: block;
  cursor: grab;
  touch-action: none;
}
canvas#sky.dragging { cursor: grabbing; }

/* Top HUD */
.hud-top {
  position: absolute;
  top: 18px;
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 10;
}
.hud-title-group h1 {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: .02em;
}
.hud-title-group h1 em {
  color: var(--brass);
  font-style: italic;
}
.hud-spec {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-dim);
  margin-top: 4px;
}
.hud-spec .kw { color: var(--brass); font-weight: 500; }

.hud-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  pointer-events: auto;
}
.waypoint-btn {
  background: var(--night-2);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .2s;
}
.waypoint-btn:hover { border-color: var(--brass); color: var(--ink); }
.waypoint-btn.active { border-color: var(--teal); color: var(--teal); font-weight: 600; }

/* Bottom HUD */
.hud-bottom {
  position: absolute;
  bottom: 16px;
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  pointer-events: none;
  font-family: var(--mono);
  font-size: 12px;
  z-index: 10;
}
.hud-readout {
  display: flex;
  gap: 16px;
  color: var(--ink-dim);
  background: rgba(10, 15, 26, 0.75);
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid rgba(28, 39, 64, 0.6);
  backdrop-filter: blur(8px);
}
.hud-readout b { color: var(--ink); font-weight: 500; }
.hud-status {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  backdrop-filter: blur(8px);
  background: rgba(10, 15, 26, 0.75);
  border: 1px solid var(--line);
  color: var(--ink-dim);
}
.hud-status.pass {
  border-color: var(--teal-dim);
  color: var(--teal);
  background: rgba(95, 212, 196, 0.1);
}
.hud-status.fail {
  border-color: var(--crimson-dim);
  color: var(--crimson);
  background: rgba(226, 85, 106, 0.1);
}

/* --- Right Pane: Neovim Editor --- */
.editor-pane {
  flex: 1;
  height: 100vh;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  background: #0d1424;
}

/* CodeMirror Neovim Custom Theme */
.CodeMirror {
  flex: 1;
  height: auto;
  font-family: var(--mono);
  font-size: 14.5px;
  line-height: 1.65;
  background: #0d1424 !important;
  color: var(--ink) !important;
}
.CodeMirror-gutters {
  background: #090e1b !important;
  border-right: 1px solid #172238 !important;
}
.CodeMirror-linenumber {
  color: #3b4b6d !important;
  padding: 0 10px 0 6px !important;
}
.CodeMirror-cursor {
  border-left: 2px solid var(--teal) !important;
}
.cm-fat-cursor .CodeMirror-cursor {
  background: var(--brass) !important;
  opacity: 0.75 !important;
}
.cm-animate-fat-cursor {
  background-color: var(--brass) !important;
  opacity: 0.75 !important;
}

/* C++ Syntax Highlighting */
.cm-s-default .cm-keyword { color: var(--brass); font-weight: 600; }
.cm-s-default .cm-def { color: var(--teal); font-weight: 600; }
.cm-s-default .cm-variable { color: var(--ink); }
.cm-s-default .cm-variable-2 { color: #b8c7e0; }
.cm-s-default .cm-number { color: #f1b37b; }
.cm-s-default .cm-comment { color: #536488; font-style: italic; }
.cm-s-default .cm-string { color: var(--violet); }
.cm-s-default .cm-operator { color: var(--teal); }
.cm-s-default .cm-meta { color: #9aa8c7; }

/* Neovim Statusline */
.nvim-statusline {
  height: 28px;
  background: #090e1b;
  border-top: 1px solid #1a253d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 12px;
  user-select: none;
}
.nvim-mode {
  padding: 0 12px;
  height: 100%;
  display: flex;
  align-items: center;
  font-weight: 600;
  letter-spacing: .05em;
  font-size: 11px;
}
.mode-normal { background: var(--brass); color: #0b0f1a; }
.mode-insert { background: var(--teal); color: #041a17; }
.mode-visual { background: var(--violet); color: #0e091d; }

.nvim-file {
  color: var(--ink-dim);
  padding: 0 12px;
}
.nvim-file b { color: var(--ink); font-weight: 500; }

.nvim-info {
  display: flex;
  gap: 16px;
  align-items: center;
  color: var(--ink-dim);
  padding-right: 12px;
}
.nvim-run-btn {
  background: #141f36;
  border: 1px solid var(--line);
  color: var(--teal);
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
}
.nvim-run-btn:hover { background: var(--teal); color: #041a17; }

/* CodeMirror Dialog (Vim Ex Command Bar `:`) */
.CodeMirror-dialog {
  background: #090e1b !important;
  color: var(--ink) !important;
  border-top: 1px solid var(--line) !important;
  font-family: var(--mono) !important;
  font-size: 13px !important;
  padding: 4px 10px !important;
}
.CodeMirror-dialog input {
  background: transparent !important;
  color: var(--teal) !important;
  font-family: var(--mono) !important;
  font-size: 13px !important;
  outline: none !important;
  border: none !important;
}
</style>

<body>

<div class="split-container">

  <!-- LEFT PANE: SPHERE VISUALIZATION -->
  <div class="sphere-pane" id="sphere-pane">
    <div class="hud-top">
      <div class="hud-title-group">
        <h1><em>Rihla</em> · <span id="hud-level-title">First Steps</span></h1>
        <div class="hud-spec" id="hud-spec">reach(60°N, 0°) within 3°</div>
      </div>
      <div class="hud-actions" id="hud-waypoints"></div>
    </div>

    <canvas id="sky"></canvas>

    <div class="hud-bottom">
      <div class="hud-readout" id="hud-readout">
        <span>pos <b>—</b></span>
        <span>turn <b>0°</b></span>
        <span>len <b>0°</b></span>
        <span>holonomy <b>—</b></span>
      </div>
      <div class="hud-status" id="hud-status">Type :w to compile &amp; run</div>
    </div>
  </div>

  <!-- RIGHT PANE: NEOVIM TEXT ENTRY -->
  <div class="editor-pane">
    <textarea id="nvim-editor"></textarea>
    <div class="nvim-statusline">
      <div class="nvim-mode mode-normal" id="nvim-mode">NORMAL</div>
      <div class="nvim-file"><b>path.cpp</b> [C++]</div>
      <div class="nvim-info">
        <span id="nvim-cursor">ln 1, col 1</span>
        <button class="nvim-run-btn" id="run-trigger" title="Or type :w in Normal Mode">Run (:w)</button>
      </div>
    </div>
  </div>

</div>

<script>
"use strict";

/* ========================================================================= */
/* 1. SPHERICAL GEOMETRY ENGINE                                             */
/* ========================================================================= */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ],
  norm: (a) => {
    const n = Math.hypot(a[0], a[1], a[2]);
    return n < 1e-12 ? [0, 0, 1] : [a[0] / n, a[1] / n, a[2] / n];
  }
};

function ll(lat, lon) {
  const la = lat * D2R, lo = lon * D2R;
  return [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
}
function toLatLon(p) {
  return [Math.asin(Math.max(-1, Math.min(1, p[2]))) * R2D, Math.atan2(p[1], p[0]) * R2D];
}
function northAt(p) {
  const z = [0, 0, 1];
  const t = V.sub(z, V.scale(p, V.dot(z, p)));
  const n = Math.hypot(...t);
  return n < 1e-9 ? [1, 0, 0] : V.scale(t, 1 / n);
}
function eastAt(p) {
  const c = V.cross([0, 0, 1], p);
  const n = Math.hypot(...c);
  return n < 1e-9 ? [0, 1, 0] : V.scale(c, 1 / n);
}
function stepForward(p, h, thDeg) {
  const th = thDeg * D2R;
  const p2 = V.add(V.scale(p, Math.cos(th)), V.scale(h, Math.sin(th)));
  const h2 = V.sub(V.scale(h, Math.cos(th)), V.scale(p, Math.sin(th)));
  return [V.norm(p2), V.norm(h2)];
}
function turnHeading(p, h, aDeg) {
  const a = aDeg * D2R;
  return V.norm(V.add(V.scale(h, Math.cos(a)), V.scale(V.cross(p, h), Math.sin(a))));
}
function rodrigues(v, axis, thDeg) {
  const th = thDeg * D2R, c = Math.cos(th), s = Math.sin(th);
  return V.add(V.add(V.scale(v, c), V.scale(V.cross(axis, v), s)), V.scale(axis, V.dot(axis, v) * (1 - c)));
}
function gdist(a, b) {
  return Math.acos(Math.max(-1, Math.min(1, V.dot(a, b)))) * R2D;
}
function signedAngleAt(u, v, p) {
  return Math.atan2(V.dot(V.cross(u, v), p), V.dot(u, v)) * R2D;
}

/* ========================================================================= */
/* 2. C++ DSL COMPILER & SIMULATOR                                          */
/* ========================================================================= */
function parseCppProgram(src) {
  const cmds = [], errors = [];
  let steps = 0;
  const MAX_STEPS = 25000;

  function forward(deg) {
    if (++steps > MAX_STEPS) throw new Error("Execution limit exceeded (>25,000 steps, possible infinite loop)");
    const val = Number(deg);
    if (isNaN(val) || val <= 0 || val > 360) {
      errors.push(`forward(${deg}): length must be between 0 and 360 degrees`);
    } else {
      cmds.push({ op: "forward", val });
    }
  }

  function turn(deg) {
    if (++steps > MAX_STEPS) throw new Error("Execution limit exceeded (>25,000 steps, possible infinite loop)");
    const val = Number(deg);
    if (isNaN(val)) {
      errors.push(`turn(${deg}): invalid angle argument`);
    } else {
      cmds.push({ op: "turn", val });
    }
  }
  const fd = forward, t = turn;

  let js = src;
  // Handle bare commands: forward 60; -> forward(60);
  js = js.replace(/^\s*(forward|fd|turn|t)\s+([-\d.]+)\s*;?\s*$/gmi, "$1($2);");
  // Strip preprocessor headers
  js = js.replace(/^\s*#.*$/gm, "");
  // Strip using namespace ...;
  js = js.replace(/^\s*using\s+namespace\s+[^;]+;/gm, "");
  // Replace C++ function declarations: void path() -> function path()
  js = js.replace(/\b(void|int|double|float|auto)\s+([a-zA-Z_]\w*)\s*\(/g, "function $2(");
  // Replace C++ type declarations with let / const
  js = js.replace(/\b(int|double|float|auto|size_t)\s+/g, "let ");
  js = js.replace(/\bconst\s+(int|double|float|auto|size_t)\s+/g, "const ");

  try {
    const fn = new Function("forward", "turn", "fd", "t", `
      ${js}
      if (typeof path === "function") path();
      else if (typeof run === "function") run();
      else if (typeof main === "function") main();
    `);
    fn(forward, turn, fd, t);
  } catch (err) {
    errors.push(`C++ Compile Error: ${err.message}`);
  }
  return { cmds, errors };
}

function simulate(level, cmds) {
  let p = ll(level.start.lat, level.start.lon);
  let h = level.start.heading === "east" ? eastAt(p) : northAt(p);
  let r = h.slice(); // Ghost compass (parallel transport only)
  const p0 = p.slice(), h0 = h.slice();
  const samples = [{ p: p.slice(), t: 0 }];
  let totalTurn = 0, pathLen = 0;

  for (const c of cmds) {
    if (c.op === "turn") {
      h = turnHeading(p, h, c.val);
      totalTurn += Math.abs(c.val);
    } else {
      const n = Math.max(2, Math.ceil(Math.abs(c.val) * 2));
      const step = c.val / n;
      for (let i = 0; i < n; i++) {
        const axis = V.norm(V.cross(p, h));
        r = rodrigues(r, axis, step);
        [p, h] = stepForward(p, h, step);
        samples.push({ p: p.slice() });
      }
      pathLen += Math.abs(c.val);
    }
  }

  const rTan = V.norm(V.sub(r, V.scale(p0, V.dot(r, p0))));
  const rEnd = V.norm(V.sub(r, V.scale(p, V.dot(r, p))));
  const holonomy = signedAngleAt(h0, rTan, p0);
  const closureErr = gdist(p, p0);

  return {
    samples,
    end: p,
    endHeading: h,
    ghost: rTan,
    ghostEnd: rEnd,
    start: p0,
    startHeading: h0,
    totalTurn,
    pathLen,
    holonomy,
    closureErr
  };
}

/* ========================================================================= */
/* 3. WAYPOINTS & SPECIFICATIONS                                            */
/* ========================================================================= */
const LEVELS = [
  {
    title: "First Steps",
    specText: "reach(60°N, 0°) within 3°",
    start: { lat: 0, lon: 0, heading: "north" },
    view: { yaw: 0, pitch: 26 },
    target: { lat: 60, lon: 0, tol: 3 },
    code: `#include <rihla.hpp>

void path() {
    // Reach the teal target along the meridian
    forward(60.0);
}
`,
    spec(res) {
      const err = gdist(res.end, ll(60, 0));
      return [{ ok: err <= 3, label: `goal: reach(60°N, 0°) — ${err.toFixed(1)}° away` }];
    }
  },
  {
    title: "The Turn",
    specText: "reach(30°N, 54.7°E) | turning_total() <= 120°",
    start: { lat: 0, lon: 0, heading: "north" },
    view: { yaw: -24, pitch: 22 },
    target: { lat: 30.0, lon: 54.74, tol: 3 },
    code: `#include <rihla.hpp>

void path() {
    // Turn and reach the off-meridian target
    turn(-35.0);
    forward(65.0);
}
`,
    spec(res) {
      const err = gdist(res.end, ll(30.0, 54.74));
      return [
        { ok: err <= 3, label: `goal: reach ring — ${err.toFixed(1)}° away` },
        { ok: res.totalTurn <= 120, label: `invariant: turn ${res.totalTurn.toFixed(0)}° <= 120°` }
      ];
    }
  },
  {
    title: "The Storm",
    specText: "reach(50°N, 0°) | dist(storm_center) >= 20°",
    start: { lat: -50, lon: 0, heading: "north" },
    view: { yaw: 0, pitch: 4 },
    target: { lat: 50, lon: 0, tol: 4 },
    storm: { lat: 0, lon: 0, radius: 20 },
    code: `#include <rihla.hpp>

void path() {
    // Maneuver around the storm at (0, 0)
    turn(-35.0);
    forward(55.0);
    turn(43.0);
    forward(55.0);
}
`,
    spec(res) {
      const c = ll(0, 0);
      let minD = 1e9, breach = null;
      for (const s of res.samples) {
        const d = gdist(s.p, c);
        if (d < minD) minD = d;
        if (d < 20 && !breach) breach = toLatLon(s.p);
      }
      const err = gdist(res.end, ll(50, 0));
      return [
        { ok: !breach, label: breach ? `storm breached (closest pass ${minD.toFixed(1)}°)` : `storm avoided (pass ${minD.toFixed(1)}°)` },
        { ok: err <= 4, label: `goal: reach target — ${err.toFixed(1)}° away` }
      ];
    }
  },
  {
    title: "The Turning Home",
    specText: "closed() within 3° | |holonomy()| = 90° within 8°",
    start: { lat: 0, lon: 0, heading: "east" },
    view: { yaw: -38, pitch: 30 },
    target: { lat: 0, lon: 0, tol: 3 },
    code: `#include <rihla.hpp>

void path() {
    // 90-90-90 spherical triangle: Gauss-Bonnet holonomy
    for (int i = 0; i < 3; ++i) {
        forward(90.0);
        turn(90.0);
    }
}
`,
    spec(res) {
      const closed = res.closureErr <= 3;
      const holoOK = closed && Math.abs(Math.abs(res.holonomy) - 90) <= 8;
      return [
        { ok: closed, label: `goal: closed loop (${res.closureErr.toFixed(1)}° gap)` },
        { ok: holoOK, label: closed ? `holonomy rotation: ${res.holonomy.toFixed(1)}° (target 90°)` : `open loop: holonomy undefined` }
      ];
    }
  }
];

let levelIdx = 0;
const completed = LEVELS.map(() => false);

/* ========================================================================= */
/* 4. CANVAS RENDERER                                                       */
/* ========================================================================= */
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
let view = { yaw: 0, pitch: 20 };
let lastResult = null, drawProgress = 1, violSet = null, animId = null;

function resizeCanvas() {
  const container = document.getElementById("sphere-pane");
  const rect = container.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(rect.width, rect.height) * 0.94;
  cv.width = size * dpr;
  cv.height = size * dpr;
  cv.style.width = size + "px";
  cv.style.height = size + "px";
  render();
}
window.addEventListener("resize", resizeCanvas);

function project(p) {
  const cy = Math.cos(view.yaw * D2R), sy = Math.sin(view.yaw * D2R);
  const cp = Math.cos(view.pitch * D2R), sp = Math.sin(view.pitch * D2R);
  const x1 = p[0] * cy - p[1] * sy, y1 = p[0] * sy + p[1] * cy, z1 = p[2];
  const x2 = x1 * cp + z1 * sp, z2 = -x1 * sp + z1 * cp;
  return { sx: y1, sy: -z2, depth: x2 };
}
function screen(pr, W, Rpx) { return [W / 2 + pr.sx * Rpx, W / 2 + pr.sy * Rpx]; }

function drawArcSampled(points, W, Rpx, colorFront, colorBack, width, flags) {
  ctx.lineWidth = width; ctx.lineCap = "round"; ctx.lineJoin = "round";
  let prev = null;
  for (let i = 0; i < points.length; i++) {
    const pr = project(points[i]);
    const [x, y] = screen(pr, W, Rpx);
    if (prev) {
      const front = (pr.depth >= 0 && prev.depth >= 0);
      const bad = flags && (flags[i] || flags[i - 1]);
      ctx.strokeStyle = bad ? (front ? "rgba(226,85,106,.95)" : "rgba(226,85,106,.28)")
                            : (front ? colorFront : colorBack);
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(x, y); ctx.stroke();
    }
    prev = { x, y, depth: pr.depth };
  }
}
function circlePoints(center, radiusDeg, n = 96) {
  const u = Math.abs(center[2]) < .9 ? V.norm(V.cross(center, [0, 0, 1])) : V.norm(V.cross(center, [1, 0, 0]));
  const w = V.norm(V.cross(center, u));
  const cr = Math.cos(radiusDeg * D2R), sr = Math.sin(radiusDeg * D2R);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * 2 * Math.PI;
    pts.push(V.add(V.scale(center, cr), V.add(V.scale(u, sr * Math.cos(a)), V.scale(w, sr * Math.sin(a)))));
  }
  return pts;
}
function drawMarker(p, W, Rpx, color, r, fill = true, glow = false) {
  const pr = project(p); if (pr.depth < -0.02) return;
  const [x, y] = screen(pr, W, Rpx);
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  if (fill) { ctx.fillStyle = color; ctx.fill(); } else { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.shadowBlur = 0;
}
function drawNeedle(p, dir, W, Rpx, color, lenDeg) {
  const pr = project(p); if (pr.depth < 0) return;
  const tip = V.norm(V.add(V.scale(p, Math.cos(lenDeg * D2R)), V.scale(dir, Math.sin(lenDeg * D2R))));
  const pt = project(tip);
  const [x0, y0] = screen(pr, W, Rpx), [x1, y1] = screen(pt, W, Rpx);
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - 9 * Math.cos(ang - 0.42), y1 - 9 * Math.sin(ang - 0.42));
  ctx.lineTo(x1 - 9 * Math.cos(ang + 0.42), y1 - 9 * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function render() {
  const W = cv.width;
  const Rpx = W * 0.42;
  ctx.clearRect(0, 0, W, W);
  const lvl = LEVELS[levelIdx];

  // Sphere base disk
  const g = ctx.createRadialGradient(W / 2 - Rpx * 0.3, W / 2 - Rpx * 0.35, Rpx * 0.1, W / 2, W / 2, Rpx * 1.05);
  g.addColorStop(0, "#19243d");
  g.addColorStop(0.7, "#121b2f");
  g.addColorStop(1, "#0a101d");
  ctx.beginPath(); ctx.arc(W / 2, W / 2, Rpx, 0, 2 * Math.PI); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(201,165,87,.45)"; ctx.lineWidth = 1.5; ctx.stroke();

  // Graticule latitudes
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = []; for (let lon = 0; lon <= 360; lon += 4) pts.push(ll(lat, lon));
    drawArcSampled(pts, W, Rpx, lat === 0 ? "rgba(201,165,87,.4)" : "rgba(201,165,87,.14)", "rgba(201,165,87,.04)", lat === 0 ? 1.4 : 1);
  }
  // Graticule meridians
  for (let lon = 0; lon < 180; lon += 30) {
    const pts = []; for (let lat = -90; lat <= 90; lat += 4) { pts.push(ll(lat, lon)); }
    for (let lat = 90; lat >= -90; lat -= 4) { pts.push(ll(lat, lon + 180)); }
    drawArcSampled(pts, W, Rpx, "rgba(201,165,87,.14)", "rgba(201,165,87,.04)", 1);
  }

  // Storm zone
  if (lvl.storm) {
    const c = ll(lvl.storm.lat, lvl.storm.lon);
    for (let r = lvl.storm.radius; r > 2; r -= 4) {
      drawArcSampled(circlePoints(c, r), W, Rpx, "rgba(226,85,106,.34)", "rgba(226,85,106,.08)", r === lvl.storm.radius ? 2 : 1);
    }
    drawMarker(c, W, Rpx, "rgba(226,85,106,.9)", 3);
  }

  // Target ring
  if (lvl.target) {
    const t = ll(lvl.target.lat, lvl.target.lon);
    drawArcSampled(circlePoints(t, lvl.target.tol), W, Rpx, "rgba(95,212,196,.9)", "rgba(95,212,196,.2)", 2);
    drawMarker(t, W, Rpx, "#5fd4c4", 3, true, true);
  }

  // Start position
  const s = ll(lvl.start.lat, lvl.start.lon);
  drawMarker(s, W, Rpx, "#c9a557", 5, true, true);

  // Path
  if (lastResult) {
    const n = Math.max(2, Math.floor(lastResult.samples.length * drawProgress));
    const pts = lastResult.samples.slice(0, n).map(o => o.p);
    const flags = violSet ? violSet.slice(0, n) : null;
    drawArcSampled(pts, W, Rpx, "rgba(95,212,196,.95)", "rgba(95,212,196,.22)", 2.6, flags);
    const endP = pts[pts.length - 1];
    drawMarker(endP, W, Rpx, "#e9e3d3", 4);
    if (drawProgress >= 1) {
      drawNeedle(lastResult.end, lastResult.endHeading, W, Rpx, "#5fd4c4", 10);
      drawNeedle(lastResult.end, lastResult.ghostEnd || lastResult.ghost, W, Rpx, "#c9a557", 10);
    }
  } else {
    const h0 = lvl.start.heading === "east" ? eastAt(s) : northAt(s);
    drawNeedle(s, h0, W, Rpx, "#5fd4c4", 10);
  }
}

// Drag rotation
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener("pointerdown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add("dragging"); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  view.yaw += (e.clientX - lastX) * 0.4;
  view.pitch = Math.max(-85, Math.min(85, view.pitch + (e.clientY - lastY) * 0.4));
  lastX = e.clientX; lastY = e.clientY; render();
});
cv.addEventListener("pointerup", () => { dragging = false; cv.classList.remove("dragging"); });

/* ========================================================================= */
/* 5. CODE-MIRROR NEOVIM INTEGRATION                                        */
/* ========================================================================= */
const editor = CodeMirror.fromTextArea(document.getElementById("nvim-editor"), {
  lineNumbers: true,
  mode: "text/x-c++src",
  keyMap: "vim",
  matchBrackets: true,
  tabSize: 4,
  indentUnit: 4
});

// Update Neovim statusline cursor coordinates
editor.on("cursorActivity", () => {
  const pos = editor.getCursor();
  document.getElementById("nvim-cursor").textContent = `ln ${pos.line + 1}, col ${pos.ch + 1}`;
});

// Update Neovim statusline mode badge
editor.on("vim-mode-change", (e) => {
  const badge = document.getElementById("nvim-mode");
  if (e.mode === "normal") {
    badge.textContent = "NORMAL";
    badge.className = "nvim-mode mode-normal";
  } else if (e.mode === "insert") {
    badge.textContent = "INSERT";
    badge.className = "nvim-mode mode-insert";
  } else if (e.mode === "visual") {
    badge.textContent = "VISUAL";
    badge.className = "nvim-mode mode-visual";
  }
});

// Custom Neovim Ex Commands: `:w`, `:next`, `:prev`
CodeMirror.Vim.defineEx("write", "w", () => {
  runPath();
});
CodeMirror.Vim.defineEx("next", "n", () => {
  if (levelIdx < LEVELS.length - 1) loadLevel(levelIdx + 1);
});
CodeMirror.Vim.defineEx("prev", "p", () => {
  if (levelIdx > 0) loadLevel(levelIdx - 1);
});

// Run trigger via button or keyboard Ctrl+Enter
document.getElementById("run-trigger").addEventListener("click", () => runPath());
editor.setOption("extraKeys", {
  "Ctrl-Enter": () => runPath(),
  "Cmd-Enter": () => runPath()
});

/* ========================================================================= */
/* 6. GAME FLOW & EXECUTION                                                 */
/* ========================================================================= */
function updateReadout(res) {
  const el = document.getElementById("hud-readout");
  if (!res) {
    el.innerHTML = `<span>pos <b>—</b></span><span>turn <b>0°</b></span><span>len <b>0°</b></span><span>holonomy <b>—</b></span>`;
    return;
  }
  const [la, lo] = toLatLon(res.end);
  const holo = res.closureErr <= 3 ? `${res.holonomy.toFixed(1)}°` : "open loop";
  el.innerHTML =
    `<span>pos <b>(${la.toFixed(1)}°, ${lo.toFixed(1)}°)</b></span>` +
    `<span>turn <b>${res.totalTurn.toFixed(0)}°</b></span>` +
    `<span>len <b>${res.pathLen.toFixed(0)}°</b></span>` +
    `<span>ghost <b>${holo}</b></span>`;
}

function runPath() {
  const lvl = LEVELS[levelIdx];
  const src = editor.getValue();
  const { cmds, errors } = parseCppProgram(src);
  const statusEl = document.getElementById("hud-status");

  if (errors.length) {
    statusEl.className = "hud-status fail";
    statusEl.textContent = errors[0];
    return;
  }
  if (!cmds.length) {
    statusEl.className = "hud-status";
    statusEl.textContent = "Empty path. Write forward(deg); or turn(deg);";
    return;
  }

  const res = simulate(lvl, cmds);
  lastResult = res;
  if (lvl.storm) {
    const c = ll(lvl.storm.lat, lvl.storm.lon);
    violSet = res.samples.map(s => gdist(s.p, c) < lvl.storm.radius);
  } else {
    violSet = null;
  }
  updateReadout(res);

  if (animId) cancelAnimationFrame(animId);
  drawProgress = 0;
  const dur = Math.min(2800, 300 + res.pathLen * 10);
  const t0 = performance.now();

  function frame(t) {
    drawProgress = Math.min(1, (t - t0) / dur);
    render();
    if (drawProgress < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      const checks = lvl.spec(res);
      const pass = checks.every(c => c.ok);
      if (pass) {
        completed[levelIdx] = true;
        renderWaypoints();
        statusEl.className = "hud-status pass";
        statusEl.textContent = levelIdx < LEVELS.length - 1
          ? `[✓ Q.E.D. ADMISSIBLE] Type :n for next waypoint`
          : `[✓ 100% COMPLETE] All spherical invariants satisfied!`;
      } else {
        statusEl.className = "hud-status fail";
        const bad = checks.find(c => !c.ok);
        statusEl.textContent = `[✗ INADMISSIBLE] ${bad.label}`;
      }
    }
  }
  animId = requestAnimationFrame(frame);
}

function renderWaypoints() {
  const container = document.getElementById("hud-waypoints");
  container.innerHTML = LEVELS.map((lvl, idx) => {
    const isAct = idx === levelIdx ? "active" : "";
    const isDone = completed[idx] ? "✓ " : "";
    return `<button class="waypoint-btn ${isAct}" onclick="loadLevel(${idx})">${isDone}${idx + 1}</button>`;
  }).join("");
}

function loadLevel(idx) {
  levelIdx = idx;
  const lvl = LEVELS[idx];
  view = { ...lvl.view };
  lastResult = null;
  violSet = null;
  drawProgress = 1;

  document.getElementById("hud-level-title").textContent = lvl.title;
  document.getElementById("hud-spec").textContent = lvl.specText;
  document.getElementById("hud-status").className = "hud-status";
  document.getElementById("hud-status").textContent = "Type :w to compile & run";

  editor.setValue(lvl.code);
  renderWaypoints();
  updateReadout(null);
  render();
}

// Initial boot
resizeCanvas();
loadLevel(0);
</script>
